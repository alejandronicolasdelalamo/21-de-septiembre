<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Universo Entero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#f5d98b; --pink:#ff7ac8; --cyan:#7ae8ff; --purple:#b58cff;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#03040d;overflow:hidden;font-family:'Poppins',sans-serif;}
  canvas{display:block;touch-action:none;}
  #ui{
    position:fixed;inset:0;pointer-events:none;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding-top:calc(6vh + env(safe-area-inset-top,0px));text-align:center;
  }
  #titulo{
    font-family:'Playfair Display',serif;font-weight:700;color:var(--gold);
    font-size:clamp(1.8rem,5vw,3.2rem);text-shadow:0 0 18px rgba(245,217,139,.6),0 0 40px rgba(255,122,200,.3);
    opacity:0;letter-spacing:1px;
  }
  #dedicatoria{
    max-width:600px;margin-top:14px;color:#e8e3ff;font-weight:300;
    font-size:clamp(.9rem,2.2vw,1.15rem);line-height:1.6;opacity:0;padding:0 20px;
    text-shadow:0 0 10px rgba(181,140,255,.5);
  }
  #hint{
    position:fixed;bottom:calc(4vh + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
    color:#cfc9f5;font-size:.85rem;letter-spacing:.5px;opacity:0;z-index:10;
  }
  /* (player removed) */
  /* Lightbox */
  #lightbox{
    position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    background:rgba(3,4,13,.75);backdrop-filter:blur(6px);
  }
  #lb-card{
    max-width:min(80vw,420px);background:rgba(24,18,45,.85);border:1px solid rgba(245,217,139,.4);
    border-radius:18px;padding:20px;text-align:center;box-shadow:0 0 40px rgba(181,140,255,.5);
  }
  #lb-card img{width:100%;border-radius:12px;display:block;margin-bottom:14px;}
  #lb-card p{color:#f0ecff;font-size:.95rem;line-height:1.5;}
  #lb-close{margin-top:14px;background:none;border:1px solid var(--gold);color:var(--gold);
    padding:6px 18px;border-radius:20px;cursor:pointer;font-family:'Poppins',sans-serif;}
</style>
</head>
<body>

<div id="ui">
  <h1 id="titulo">Mi Universo Entero</h1>
  <!-- ✏️ CAMBIA AQUÍ el mensaje de dedicatoria -->
  <p id="dedicatoria">Hoy es 21 de septiembre, el día de regalar girasoles. Aquí tienes un jardín entero flotando entre estrellas, con cada recuerdo nuestro brillando como uno más 🌻💛</p>
</div>
<div id="hint">🌻 Desliza para explorar el espacio · toca una foto ✨</div>

<!-- music player removed -->

<div id="lightbox">
  <div id="lb-card">
    <img id="lb-img" src="" alt="">
    <p id="lb-msg"></p>
    <button id="lb-close" onclick="cerrarLightbox()">cerrar</button>
  </div>
</div>

  const c = document.createElement('canvas'); c.width=c.height=128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const glowBlanco = texturaGlow('rgba(255,255,255,1)');

// ---------- Campo de estrellas (+3000) ----------
const N_ESTRELLAS = 4500;
const posE = new Float32Array(N_ESTRELLAS*3);
const faseE = new Float32Array(N_ESTRELLAS);
for(let i=0;i<N_ESTRELLAS;i++){
  const r = 60 + Math.random()*260;
  const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
  posE[i*3]   = r*Math.sin(ph)*Math.cos(th);
  posE[i*3+1] = r*Math.sin(ph)*Math.sin(th);
  posE[i*3+2] = r*Math.cos(ph);
  faseE[i] = Math.random()*Math.PI*2;
}
const geoE = new THREE.BufferGeometry();
geoE.setAttribute('position', new THREE.BufferAttribute(posE,3));
geoE.setAttribute('fase', new THREE.BufferAttribute(faseE,1));
const matE = new THREE.ShaderMaterial({
  uniforms:{ uTime:{value:0}, uTex:{value:glowBlanco} },
  vertexShader:`
    attribute float fase; varying float vFase;
    void main(){
      vFase = fase;
      vec4 mv = modelViewMatrix * vec4(position,1.0);
      gl_PointSize = (1.6 + sin(fase)*1.0) * (200.0/-mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader:`
    uniform float uTime; uniform sampler2D uTex; varying float vFase;
    void main(){
      float tw = 0.5 + 0.5*sin(uTime*1.5 + vFase*6.0);
      gl_FragColor = texture2D(uTex, gl_PointCoord) * vec4(1.0,1.0,1.0, tw);
    }`,
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
});
escena.add(new THREE.Points(geoE, matE));

// ---------- Galaxia espiral central ----------
const N_GAL = 9000, RAMAS = 4, RADIO = 9, GIRO = 1.6;
const posG = new Float32Array(N_GAL*3);
const colG = new Float32Array(N_GAL*3);
const colorInt = new THREE.Color('#ffd98b'), colorExt = new THREE.Color('#7a4cff');
for(let i=0;i<N_GAL;i++){
  const rad = Math.pow(Math.random(), 1.5) * RADIO;
  const angRama = (i % RAMAS) / RAMAS * Math.PI*2;
  const giroAng = rad * GIRO;
  const rand = () => Math.pow(Math.random(),3) * (Math.random()<0.5?1:-1) * 0.35 * rad;
  posG[i*3]   = Math.cos(angRama+giroAng)*rad + rand();
  posG[i*3+1] = rand()*0.4;
  posG[i*3+2] = Math.sin(angRama+giroAng)*rad + rand();
  const mezcla = colorInt.clone().lerp(colorExt, rad/RADIO);
  colG[i*3]=mezcla.r; colG[i*3+1]=mezcla.g; colG[i*3+2]=mezcla.b;
}
const geoG = new THREE.BufferGeometry();
geoG.setAttribute('position', new THREE.BufferAttribute(posG,3));
geoG.setAttribute('color', new THREE.BufferAttribute(colG,3));
const matG = new THREE.PointsMaterial({
  size:0.14, vertexColors:true, transparent:true, opacity:0.9,
  depthWrite:false, blending:THREE.AdditiveBlending, map:glowBlanco
});
const galaxia = new THREE.Points(geoG, matG);
escena.add(galaxia);

// Núcleo brillante
const nucleo = new THREE.Mesh(
  new THREE.SphereGeometry(1.1,32,32),
  new THREE.MeshBasicMaterial({color:0xfff0c0})
);
escena.add(nucleo);
const luzNucleo = new THREE.PointLight(0xffd98b, 3, 60);
escena.add(luzNucleo);

// ---------- Nebulosas de color ----------
[['#ff7ac8',18,10],['#7ae8ff',-16,-6],['#b58cff',6,-14]].forEach(([col,x,z])=>{
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({
    map:texturaGlow(col), transparent:true, opacity:0.25,
    blending:THREE.AdditiveBlending, depthWrite:false
  }));
  spr.scale.set(30,30,1); spr.position.set(x,2,z);
  escena.add(spr);
});

// ---------- Girasoles y flores amarillas (21 de septiembre 🌻) ----------
function texturaGirasol(){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const ctx=c.getContext('2d');
  const cx=32, cy=32;
  // pétalos
  ctx.fillStyle = '#ffd23f';
  for(let p=0;p<12;p++){
    const ang = (p/12)*Math.PI*2;
    ctx.save();
    ctx.translate(cx,cy); ctx.rotate(ang);
    ctx.beginPath();
    ctx.ellipse(0,-16,5,11,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  // centro
  const g = ctx.createRadialGradient(cx,cy,0,cx,cy,9);
  g.addColorStop(0,'#7a4a1a'); g.addColorStop(1,'#4a2c0d');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(cx,cy,8,0,Math.PI*2); ctx.fill();
  return new THREE.CanvasTexture(c);
}
const texGirasol = texturaGirasol();

const N_GIRASOLES = 180;
const girasoles = new THREE.Group();
const datosGirasol = [];
for(let i=0;i<N_GIRASOLES;i++){
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({
    map:texGirasol, transparent:true, depthWrite:false
  }));
  const r = 8 + Math.random()*45;
  const ang = Math.random()*Math.PI*2;
  const alto = (Math.random()-0.5)*22;
  const escala = 0.5 + Math.random()*0.9;
  spr.scale.set(escala, escala, 1);
  spr.position.set(Math.cos(ang)*r, alto, Math.sin(ang)*r);
  datosGirasol.push({base:spr.position.clone(), fase:Math.random()*Math.PI*2});
  girasoles.add(spr);
}
escena.add(girasoles);

// ---------- Tarjetas flotantes con fotos ----------
function texturaTarjeta(foto){
  const c=document.createElement('canvas'); c.width=256;c.height=320;
  const ctx=c.getContext('2d');
  const r=20;
  ctx.fillStyle='rgba(25,18,48,.9)';
  ctx.beginPath();
  ctx.moveTo(r,0);ctx.arcTo(256,0,256,320,r);ctx.arcTo(256,320,0,320,r);
  ctx.arcTo(0,320,0,0,r);ctx.arcTo(0,0,256,0,r);ctx.closePath();ctx.fill();
  if(foto.src){
    return new Promise(res=>{
      const img=new Image();
      img.onload=()=>{ ctx.drawImage(img,14,14,228,228); dibujarBorde(ctx); res(new THREE.CanvasTexture(c)); };
      img.src=foto.src;
    });
  } else {
    // Placeholder: degradado + texto (reemplaza foto.src por tu imagen)
    const g=ctx.createLinearGradient(0,0,256,256);
    g.addColorStop(0,'#3a2a6c'); g.addColorStop(1,'#7a2a6c');
    ctx.fillStyle=g; ctx.fillRect(14,14,228,228);
    ctx.fillStyle='rgba(255,255,255,.85)'; ctx.font='14px Poppins, sans-serif';
    ctx.textAlign='center';
    ctx.fillText('tu foto aquí', 128, 128);
    dibujarBorde(ctx);
    return Promise.resolve(new THREE.CanvasTexture(c));
  }
  function dibujarBorde(ctx){
    ctx.strokeStyle='rgba(245,217,139,.8)'; ctx.lineWidth=3;
    ctx.strokeRect(14,14,228,228);
    ctx.fillStyle='#fff'; ctx.font='13px Poppins, sans-serif'; ctx.textAlign='center';
    ctx.fillText(foto.caption.slice(0,28), 128, 300);
  }
}

const tarjetas = [];
const raycaster = new THREE.Raycaster();
const puntero = new THREE.Vector2();

FOTOS.forEach((foto, i) => {
  texturaTarjeta(foto).then(tex=>{
    const mat = new THREE.MeshBasicMaterial({map:tex, transparent:true, side:THREE.DoubleSide});
    const geo = new THREE.PlaneGeometry(4,5);
    const malla = new THREE.Mesh(geo, mat);
    const ang = (i / FOTOS.length) * Math.PI*2;
    const radio = 15 + Math.random()*4;
    malla.userData = {
      caption: foto.caption,
      src: foto.src,
      base: new THREE.Vector3(Math.cos(ang)*radio, (Math.random()-0.5)*6, Math.sin(ang)*radio),
      fase: Math.random()*Math.PI*2
    };
    malla.position.copy(malla.userData.base);
    malla.lookAt(0, malla.position.y, 0);
    escena.add(malla);
    tarjetas.push(malla);
  });
});

// ---------- Control de cámara (orbit manual + damping) ----------
let objetivoAz = 0, objetivoPol = 1.1, radioCam = 26;
let az = 0, pol = 1.1;
let arrastrando = false, prevX=0, prevY=0;
let autoRot = true, enZoom = false;

render.domElement.addEventListener('pointerdown', e=>{
  arrastrando=true; prevX=e.clientX; prevY=e.clientY; autoRot=false;
});
addEventListener('pointerup', ()=>{ arrastrando=false; });
addEventListener('pointermove', e=>{
  if(!arrastrando) return;
  const dx=e.clientX-prevX, dy=e.clientY-prevY;
  prevX=e.clientX; prevY=e.clientY;
  objetivoAz -= dx*0.005;
  objetivoPol = Math.min(2.6, Math.max(0.4, objetivoPol - dy*0.005));
});
render.domElement.addEventListener('wheel', e=>{
  radioCam = Math.min(60, Math.max(10, radioCam + e.deltaY*0.02));
}, {passive:true});

// Click / tap en tarjetas
function alClic(x,y){
  puntero.x = (x/innerWidth)*2-1;
  puntero.y = -(y/innerHeight)*2+1;
  raycaster.setFromCamera(puntero, camara);
  const hits = raycaster.intersectObjects(tarjetas);
  if(hits.length){ enfocarTarjeta(hits[0].object); }
}
render.domElement.addEventListener('click', e=> alClic(e.clientX, e.clientY));

function enfocarTarjeta(m){
  enZoom = true; autoRot = false;
  const dir = m.userData.base.clone().normalize();
  const destino = m.userData.base.clone().add(dir.multiplyScalar(5));
  gsap.to(camara.position, {
    x:destino.x, y:destino.y+1, z:destino.z, duration:1.4, ease:'power3.inOut',
    onUpdate:()=>camara.lookAt(m.position),
    onComplete:()=>abrirLightbox(m.userData)
  });
}
function abrirLightbox(datos){
  document.getElementById('lb-img').src = datos.src || generarPlaceholderImg();
  document.getElementById('lb-msg').textContent = datos.caption;
  document.getElementById('lightbox').style.display='flex';
}
function generarPlaceholderImg(){
  const c=document.createElement('canvas'); c.width=c.height=300;
  const ctx=c.getContext('2d');
  const g=ctx.createLinearGradient(0,0,300,300);
  g.addColorStop(0,'#3a2a6c'); g.addColorStop(1,'#7a2a6c');
  ctx.fillStyle=g; ctx.fillRect(0,0,300,300);
  return c.toDataURL();
}
function cerrarLightbox(){
  document.getElementById('lightbox').style.display='none';
  enZoom = false; autoRot = true;
}

// (music removed)

// ---------- Bucle de animación ----------
const reloj = new THREE.Clock();
function animar(){
  requestAnimationFrame(animar);
  const t = reloj.getElapsedTime();
  matE.uniforms.uTime.value = t;
  galaxia.rotation.y = t*0.02;
  nucleo.scale.setScalar(1 + Math.sin(t*1.5)*0.06);

  tarjetas.forEach(m=>{
    m.position.y = m.userData.base.y + Math.sin(t*0.6 + m.userData.fase)*0.6;
    m.lookAt(camara.position);
  });

  girasoles.children.forEach((spr,i)=>{
    const d = datosGirasol[i];
    spr.position.y = d.base.y + Math.sin(t*0.4 + d.fase)*0.8;
    spr.position.x = d.base.x + Math.sin(t*0.15 + d.fase)*0.4;
  });
  girasoles.rotation.y = t*0.01;

  if(autoRot) objetivoAz += 0.0015;
  az += (objetivoAz-az)*0.05;
  pol += (objetivoPol-pol)*0.05;

  if(!enZoom){
    camara.position.x = radioCam*Math.sin(pol)*Math.sin(az);
    camara.position.y = radioCam*Math.cos(pol);
    camara.position.z = radioCam*Math.sin(pol)*Math.cos(az);
    camara.lookAt(0,0,0);
  }
  render.render(escena, camara);
}
animar();

addEventListener('resize', ()=>{
  camara.aspect = innerWidth/innerHeight;
  camara.updateProjectionMatrix();
  render.setSize(innerWidth, innerHeight);
});

// ---------- Entrada de la UI (GSAP) ----------
gsap.to('#titulo', {opacity:1, y:0, duration:1.4, delay:.4, ease:'power2.out'});
gsap.to('#dedicatoria', {opacity:1, duration:1.4, delay:.9});
gsap.to('#hint', {opacity:.8, duration:1, delay:1.6});
// player UI removed
</script>
