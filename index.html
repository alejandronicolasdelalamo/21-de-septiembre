<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Universo Entero</title>
  <meta name="description" content="Una galaxia con forma de girasol para el 21 de septiembre, con nuestros recuerdos flotando entre estrellas.">
  <meta name="theme-color" content="#05030f">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mi Universo Entero">
  <meta property="og:description" content="Una galaxia con forma de girasol para el 21 de septiembre.">
  <meta property="og:image" content="https://alejandronicolasdelalamo.github.io/21-de-septiembre/docs/portada.jpg">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">

  <!--
    Mejora progresiva: sin JavaScript (o sin WebGL) la página es una galería
    normal de fotos. Este guion marca que hay JavaScript y, si la escena 3D
    no llega a arrancar por cualquier motivo, devuelve la galería.
  -->
  <script>
    (function () {
      var raiz = document.documentElement;
      raiz.classList.add('js');
      function volverAGaleria() {
        if (!raiz.classList.contains('con-universo')) raiz.classList.add('sin-webgl');
      }
      window.addEventListener('error', volverAGaleria);
      setTimeout(volverAGaleria, 15000);
    })();
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas class="universo" id="universo" aria-hidden="true"></canvas>

  <header class="cabecera">
    <!-- ✏️ Título y dedicatoria: cámbialos aquí. -->
    <h1 class="titulo" id="titulo">Mi Universo Entero</h1>
    <p class="dedicatoria">Hoy es 21 de septiembre, el día de regalar girasoles. Aquí tienes un jardín entero flotando entre estrellas, con cada recuerdo nuestro brillando como uno más 🌻💛</p>
  </header>

  <main>
    <!--
      ✏️ Las fotos: cada <figure> es un recuerdo. La escena 3D lee esta lista,
      así que para añadir, quitar o cambiar una foto basta con editarla aquí.
      El orden de la lista es el orden en que giran: la siguiente queda a la derecha.
    -->
    <section class="recuerdos" id="recuerdos" aria-label="Nuestros recuerdos">
      <figure class="recuerdo">
        <img src="assets/fotos/08.jpg" alt="Los dos de paseo" width="640" height="640" loading="lazy">
        <figcaption>Nuestra primera foto 🌻</figcaption>
      </figure>
      <figure class="recuerdo">
        <img src="assets/fotos/09.jpg" alt="Dormidos el uno sobre el otro" width="640" height="640" loading="lazy">
        <figcaption>Volviendo del retiro: tú con tu TikTok y yo contigo 😴</figcaption>
      </figure>
      <figure class="recuerdo">
        <img src="assets/fotos/07.jpg" alt="Abrazados" width="640" height="640" loading="lazy">
        <figcaption>Abrazos que no quiero soltar</figcaption>
      </figure>
      <figure class="recuerdo">
        <img src="assets/fotos/06.jpg" alt="Juntos de noche" width="640" height="640" loading="lazy">
        <figcaption>Contigo hasta la noche sabe distinta</figcaption>
      </figure>
      <figure class="recuerdo">
        <img src="assets/fotos/18.jpg" alt="Foto de recuerdo de un restaurante italiano, abrazados" width="960" height="960" loading="lazy">
        <figcaption>Cena italiana y tú: el plan perfecto 🍝</figcaption>
      </figure>
      <figure class="recuerdo">
        <img src="assets/fotos/05.jpg" alt="Un beso en un pasillo" width="640" height="640" loading="lazy">
        <figcaption>Un beso robado en cualquier pasillo 💛</figcaption>
      </figure>
      <figure class="recuerdo">
        <img src="assets/fotos/04.jpg" alt="Mirándonos" width="640" height="640" loading="lazy">
        <figcaption>Esa mirada que ya me sé de memoria</figcaption>
      </figure>
      <figure class="recuerdo">
        <img src="assets/fotos/23.jpg" alt="Él con la sudadera cerrada hasta los ojos y ella mirándolo desde la cama" width="960" height="960" loading="lazy">
        <figcaption>Yo de ninja y tú sin entender nada 🥷</figcaption>
      </figure>
      <figure class="recuerdo">
        <img src="assets/fotos/16.jpg" alt="Selfi con chaquetas de cuero, ella asomando por su hombro y tirando un beso" width="960" height="960" loading="lazy">
        <figcaption>Tus morritos asomando por mi hombro</figcaption>
      </figure>
      <figure class="recuerdo">
        <img src="assets/fotos/03.jpg" alt="Riéndonos juntos" width="640" height="640" loading="lazy">
        <figcaption>Riéndonos de todo, como siempre 🌻</figcaption>
      </figure>
      <figure class="recuerdo">
        <img src="assets/fotos/22.jpg" alt="En casa: él en primer plano, ella en el sillón con el mando y un gato dormido entre los dos" width="960" height="960" loading="lazy">
        <figcaption>Tú, el mando, el gato y yo: mi hogar 🐱</figcaption>
      </figure>
      <figure class="recuerdo">
        <img src="assets/fotos/17.jpg" alt="Foto en el espejo de un portal: él con muleta le da un beso en la frente y ella sonríe con los ojos cerrados" width="960" height="960" loading="lazy">
        <figcaption>Cojo pero feliz: tus mimos lo curan todo 🩹</figcaption>
      </figure>
      <figure class="recuerdo">
        <img src="assets/fotos/15.jpg" alt="Selfi en el Albaicín con la Alhambra al fondo" width="960" height="960" loading="lazy">
        <figcaption>La Alhambra de fondo y yo mirándote a ti</figcaption>
      </figure>
      <figure class="recuerdo">
        <img src="assets/fotos/14.jpg" alt="En una terraza de noche, ella tirando un beso y él con la cara apoyada en la mano" width="960" height="960" loading="lazy">
        <figcaption>Tú poniendo morritos y yo derretido 😘</figcaption>
      </figure>
      <figure class="recuerdo">
        <img src="assets/fotos/13.jpg" alt="Selfi junto a una pared blanca, ella con el brazo sobre su hombro" width="960" height="960" loading="lazy">
        <figcaption>Tu brazo en mi hombro y ya estoy en casa</figcaption>
      </figure>
      <figure class="recuerdo">
        <img src="assets/fotos/19.jpg" alt="Selfi de noche en una terraza llena de gente" width="960" height="960" loading="lazy">
        <figcaption>Noche de verano, terraza y tú ✨</figcaption>
      </figure>
      <figure class="recuerdo">
        <img src="assets/fotos/20.jpg" alt="Selfi en un patio de la Alhambra, entre azulejos y yeserías" width="960" height="960" loading="lazy">
        <figcaption>Perdidos entre los azulejos de la Alhambra</figcaption>
      </figure>
      <figure class="recuerdo">
        <img src="assets/fotos/21.jpg" alt="Flores amarillas creciendo junto a un muro" width="960" height="960" loading="lazy">
        <figcaption>Flores amarillas, como las que te mereces 🌻</figcaption>
      </figure>
      <figure class="recuerdo">
        <img src="assets/fotos/02.jpg" alt="Dándonos un beso" width="640" height="640" loading="lazy">
        <figcaption>Un beso, mil motivos para quedarme 💫</figcaption>
      </figure>
      <figure class="recuerdo">
        <img src="assets/fotos/01.jpg" alt="Los dos en un mirador de Granada" width="640" height="640" loading="lazy">
        <figcaption>Granada, contigo el paisaje siempre es mejor 🌻</figcaption>
      </figure>
      <figure class="recuerdo">
        <img src="assets/fotos/11.jpg" alt="Besándonos en Halloween, disfrazados de Five Nights at Freddy's: él de morado y ella con orejas de zorro y garfio" width="960" height="960" loading="lazy">
        <figcaption>Halloween: el Hombre Morado y su Foxy 💜🦊</figcaption>
      </figure>
      <figure class="recuerdo">
        <img src="assets/fotos/12.jpg" alt="En Halloween, él con cara de susto y linterna y ella tapándose la cara de la risa" width="960" height="960" loading="lazy">
        <figcaption>Guardia de noche pillado in fraganti 🔦</figcaption>
      </figure>
      <figure class="recuerdo">
        <img src="assets/fotos/10.jpg" alt="En la exposición del Infierno de Dante, sonriendo a la cámara" width="960" height="960" loading="lazy">
        <figcaption>Ni el Infierno de Dante nos quita la sonrisa 🔥</figcaption>
      </figure>
    </section>
  </main>

  <div class="controles" id="controles">
    <p class="pista" id="pista"></p>
    <button class="boton" id="verRecuerdos" type="button">Ver recuerdos</button>
  </div>

  <div class="visor" id="visor" role="group" aria-label="Recuerdo ampliado" tabindex="-1" hidden>
    <button class="visor__boton" id="anterior" type="button" aria-label="Recuerdo anterior">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <p class="visor__cuenta" id="cuenta" aria-hidden="true"></p>
    <button class="visor__boton" id="siguiente" type="button" aria-label="Recuerdo siguiente">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="visor__boton visor__boton--cerrar" id="cerrar" type="button" aria-label="Volver al universo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <p class="solo-lectores" id="anuncio" aria-live="polite"></p>

  <div class="carga" id="carga" role="status">
    <svg class="carga__flor" viewBox="-50 -50 100 100" aria-hidden="true">
      <g fill="#ffcf40">
        <ellipse rx="7" ry="20" cy="-27"/>
        <ellipse rx="7" ry="20" cy="-27" transform="rotate(45)"/>
        <ellipse rx="7" ry="20" cy="-27" transform="rotate(90)"/>
        <ellipse rx="7" ry="20" cy="-27" transform="rotate(135)"/>
        <ellipse rx="7" ry="20" cy="-27" transform="rotate(180)"/>
        <ellipse rx="7" ry="20" cy="-27" transform="rotate(225)"/>
        <ellipse rx="7" ry="20" cy="-27" transform="rotate(270)"/>
        <ellipse rx="7" ry="20" cy="-27" transform="rotate(315)"/>
      </g>
      <circle r="13" fill="#6e3a10"/>
    </svg>
    <p>Sembrando girasoles…</p>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
